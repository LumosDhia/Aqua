services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ouridea}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ouridea}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ouridea}"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ouridea}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ouridea}
      DEVICE_API_KEY: ${DEVICE_API_KEY:?set DEVICE_API_KEY in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      LLM_API_URL: ${LLM_API_URL:-https://gpu.mavubo.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5vl:7b}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost,https://localhost,capacitor://localhost,null}
      AQUAFARM_BRIDGE_ENABLED: ${AQUAFARM_BRIDGE_ENABLED:-false}
      AQUAFARM_BRIDGE_URL: ${AQUAFARM_BRIDGE_URL:-}
      AQUAFARM_BRIDGE_INTERVAL: ${AQUAFARM_BRIDGE_INTERVAL:-15}
      AQUAFARM_PUMP_MAX_MINUTES: ${AQUAFARM_PUMP_MAX_MINUTES:-2}
      UPLOADS_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    ports:
      - "127.0.0.1:8000:8000"   # behind Nginx Proxy Manager on the VPS, not public

volumes:
  dbdata:
  uploads:
